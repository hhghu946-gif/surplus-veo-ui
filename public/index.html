<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surplus AI Studio</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f4f7fb}.wrap{max-width:1040px;margin:auto;padding:36px 20px 80px}h1{margin:0;font-size:30px}.sub,.small{color:#93a0af}.tabs{display:flex;gap:8px;margin:26px 0 16px;background:#101419;border:1px solid #252b33;padding:6px;border-radius:14px}.tab{flex:1;border:0;background:transparent;color:#aeb8c6;font-weight:750}.tab.active,.primary,.choice.active{background:#f4f7fb;color:#0b0d10}.panel{display:none}.panel.active{display:block}.card{background:#12161b;border:1px solid #252b33;border-radius:18px;padding:22px}label{display:block;font-size:13px;color:#aeb8c6;margin:0 0 7px}input,textarea,select,button{width:100%;border-radius:11px;border:1px solid #303944;background:#0d1116;color:#f7f9fb;padding:12px 13px;font:inherit}textarea{min-height:145px;resize:vertical}input[type=file]{padding:18px;border-style:dashed}.primary{margin-top:20px;font-weight:800;border:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.control{margin-top:18px}.row{display:flex;gap:8px;flex-wrap:wrap}.choice{width:auto;font-weight:700}.status{display:none;margin-top:20px;border:1px solid #28303a;border-radius:12px;padding:14px;background:#0d1116}.status.show{display:block}.error{color:#ff9e9e;margin-top:10px;white-space:pre-wrap}.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-top:14px}.thumb{position:relative;aspect-ratio:16/10;border:1px solid #2b333d;border-radius:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb button{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:#000c}.result,.video{width:100%;margin-top:18px;border-radius:14px}.actions{margin-top:12px}.actions button{width:auto;background:#252d37}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Surplus AI Studio</h1>
<div class="sub">Private image and video generation interface</div>

<div class="tabs">
<button class="tab active" data-tab="videoPanel">Video Generation</button>
<button class="tab" data-tab="imagePanel">Image Generation</button>
</div>

<section id="videoPanel" class="panel active"><div class="card">
<form id="videoForm">
<label>Reference image</label><input name="image" type="file" accept="image/*" required>
<div class="grid2">
<div><label>Prompt</label><textarea name="prompt" required></textarea></div>
<div><label>Model ID</label><input id="videoModel" name="model" value="veo3-fast-image-to-video"></div>
</div>
<div class="control"><label>Aspect ratio</label><select name="aspect_ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
<button id="videoGenerate" class="primary">Generate Video</button>
</form>
<div id="videoStatus" class="status"><strong id="videoStatusText"></strong><div id="videoDetail" class="small"></div><div id="videoError" class="error"></div></div>
<div id="videoResult"></div>
</div></section>

<section id="imagePanel" class="panel"><div class="card">
<form id="imageForm">
<label>Model</label>
<select id="imageModel">
  <option value="nano-banana-2-edit" selected>Nano Banana 2 Edit</option>
  <option value="nano-banana-pro-edit">Nano Banana Pro Edit</option>
</select>
<div class="small" style="margin-top:7px">Only the two edit models are available.</div>

<div class="control">
<label>Reference images (1–8)</label>
<input id="referenceInput" type="file" accept="image/*" multiple>
<div class="small" style="margin-top:7px">All uploaded images are sent as references. Up to 8.</div>
<div id="referencePreview" class="previews"></div>
</div>

<div class="control"><label>Prompt</label><textarea id="imagePrompt" required></textarea></div>

<div class="control">
<label>Aspect ratio</label>
<div class="row"><button type="button" class="choice active">16:9</button><button type="button" class="choice">9:16</button><button type="button" class="choice">1:1</button><button type="button" class="choice">4:3</button><button type="button" class="choice">3:4</button></div>
<div class="small" style="margin-top:7px">Display preference only for now; not sent to Surplus.</div>
</div>

<div class="control">
<label>Resolution</label>
<div id="resolutionButtons" class="row"><button type="button" class="choice" data-value="1K">1K</button><button type="button" class="choice active" data-value="2K">2K</button><button type="button" class="choice" data-value="4K">4K</button></div>
<input id="imageResolution" type="hidden" value="2K">
</div>

<div class="control"><label>Output format</label><div class="row"><button type="button" class="choice active">JPG</button></div></div>
<button id="imageGenerate" class="primary">Generate Image</button>
</form>
<div id="imageStatus" class="status"><strong id="imageStatusText"></strong><div id="imageDetail" class="small"></div><div id="imageError" class="error"></div></div>
<div id="imageResult"></div>
</div></section>
</div>

<script>
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));t.classList.add("active");document.getElementById(t.dataset.tab).classList.add("active")});
fetch("/api/config").then(r=>r.json()).then(c=>{if(c.defaultVideoModel)document.getElementById("videoModel").value=c.defaultVideoModel});

const vs=document.getElementById("videoStatus"),vst=document.getElementById("videoStatusText"),vd=document.getElementById("videoDetail"),ve=document.getElementById("videoError"),vr=document.getElementById("videoResult");
function showV(t,d=""){vs.classList.add("show");vst.textContent=t;vd.textContent=d;ve.textContent=""}
async function poll(id){while(true){const r=await fetch("/api/status/"+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||"Status failed");showV("Status: "+(d.status||"unknown"),"Job ID: "+id);if(d.status==="succeeded")return d;if(["failed","canceled","expired"].includes(d.status))throw Error(d.error?.message||("Generation "+d.status));await new Promise(x=>setTimeout(x,4000))}}
document.getElementById("videoForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("videoGenerate");b.disabled=true;vr.innerHTML="";showV("Submitting generation...");try{const r=await fetch("/api/generate",{method:"POST",body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error||"Generation failed");const f=await poll(d.id);const a=f.results?.[0];const src=a?.url||a?.download_url;if(!src)throw Error("No video artifact returned");vr.innerHTML=`<video class="video" controls src="${src}"></video>`;showV("Completed","Job ID: "+d.id)}catch(x){vs.classList.add("show");vst.textContent="Generation failed";ve.textContent=x.message}finally{b.disabled=false}};

let refs=[];
const ri=document.getElementById("referenceInput"),rp=document.getElementById("referencePreview");
function render(){rp.innerHTML="";refs.forEach((f,i)=>{const box=document.createElement("div");box.className="thumb";const img=document.createElement("img");img.src=URL.createObjectURL(f);const x=document.createElement("button");x.type="button";x.textContent="×";x.onclick=()=>{refs.splice(i,1);render()};box.append(img,x);rp.append(box)})}
ri.onchange=()=>{refs=[...refs,...Array.from(ri.files||[])].slice(0,8);ri.value="";render()};
document.querySelectorAll("#resolutionButtons .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll("#resolutionButtons .choice").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("imageResolution").value=b.dataset.value});

const is=document.getElementById("imageStatus"),ist=document.getElementById("imageStatusText"),idetail=document.getElementById("imageDetail"),ie=document.getElementById("imageError"),ires=document.getElementById("imageResult");
function srcOf(i){return i?.b64_json?`data:${i.mime_type||"image/png"};base64,${i.b64_json}`:i?.url||null}
async function jpg(src){const im=new Image();im.crossOrigin="anonymous";await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=src});const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);return await new Promise(ok=>c.toBlob(ok,"image/jpeg",.95))}
document.getElementById("imageForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("imageGenerate");b.disabled=true;ires.innerHTML="";is.classList.add("show");ist.textContent="Generating image...";idetail.textContent=`Using ${refs.length} reference image${refs.length===1?"":"s"}`;ie.textContent="";try{if(!refs.length)throw Error("Add at least one reference image.");const f=new FormData();f.append("model",document.getElementById("imageModel").value);f.append("prompt",document.getElementById("imagePrompt").value);f.append("resolution",document.getElementById("imageResolution").value);refs.forEach(x=>f.append("images",x));const r=await fetch("/api/generate-image",{method:"POST",body:f});const d=await r.json();if(!r.ok)throw Error(d.error||"Image generation failed");const src=srcOf(d.data?.[0]);if(!src)throw Error("Surplus returned no image");const im=document.createElement("img");im.className="result";im.src=src;const acts=document.createElement("div");acts.className="actions";const dl=document.createElement("button");dl.type="button";dl.textContent="Download JPG";dl.onclick=async()=>{const blob=await jpg(src);const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="thumbnail.jpg";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};acts.append(dl);ires.append(im,acts);ist.textContent="Completed";idetail.textContent=`Model used: ${d.model} · References: ${d.usedReferences}`}catch(x){ist.textContent="Generation failed";ie.textContent=x.message}finally{b.disabled=false}};
</script>
</body>
</html>
