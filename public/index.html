<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veo Video Generator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0b0d10; color: #f4f7fb; min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:26px; }
    h1 { font-size: 30px; margin:0; }
    .tag { color:#9ca8b8; font-size:14px; }
    .card {
      background:#12161b; border:1px solid #252b33; border-radius:18px; padding:22px;
      box-shadow:0 18px 50px rgba(0,0,0,.22);
    }
    label { display:block; font-size:13px; color:#aeb8c6; margin:0 0 7px; }
    input, textarea, select, button {
      width:100%; border-radius:11px; border:1px solid #303944; background:#0d1116; color:#f7f9fb;
      padding:12px 13px; font:inherit;
    }
    textarea { min-height:135px; resize:vertical; line-height:1.5; }
    input[type=file] { padding:18px; border-style:dashed; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:16px; }
    .grid4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:16px; }
    .field { min-width:0; }
    button {
      margin-top:20px; background:#f4f7fb; color:#0b0d10; font-weight:750; border:0; cursor:pointer;
    }
    button:hover { opacity:.92; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .status {
      margin-top:20px; border:1px solid #28303a; border-radius:12px; padding:14px; display:none;
      background:#0d1116;
    }
    .status.show { display:block; }
    .small { color:#93a0af; font-size:13px; }
    .error { color:#ff9e9e; white-space:pre-wrap; }
    video { width:100%; border-radius:14px; margin-top:18px; background:#000; max-height:560px; }
    .actions { display:flex; gap:10px; margin-top:12px; }
    .actions a {
      display:inline-block; padding:10px 14px; border-radius:10px; background:#252d37; color:#fff; text-decoration:none;
    }
    .preview { margin-top:16px; max-width:280px; border-radius:12px; display:none; border:1px solid #28303a; }
    .check { display:flex; gap:9px; align-items:center; height:44px; }
    .check input { width:auto; }
    @media (max-width:720px) {
      .grid, .grid4 { grid-template-columns:1fr; }
      .wrap { padding-top:24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Veo Video Generator</h1>
        <div class="tag">Private Surplus Intelligence image-to-video interface</div>
      </div>
    </div>

    <div class="card">
      <form id="form">
        <div class="field">
          <label>Reference image</label>
          <input id="image" name="image" type="file" accept="image/*" required />
          <img id="preview" class="preview" alt="Reference preview" />
        </div>

        <div class="grid">
          <div class="field">
            <label>Prompt</label>
            <textarea id="prompt" name="prompt" maxlength="2000" placeholder="Example: cinematic low-angle tracking shot of the car accelerating down a mountain highway..." required></textarea>
          </div>
          <div class="field">
            <label>Model ID</label>
            <input id="model" name="model" value="veo3-fast-image-to-video" />
            <div class="small" style="margin-top:7px">If Surplus uses a different live model ID, replace it here or via SURPLUS_VIDEO_MODEL.</div>
          </div>
        </div>

          <div class="field">
            <label>Aspect ratio</label>
            <select name="aspect_ratio">
              <option value="16:9" selected>16:9</option>
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
            </select>
          </div>

        <button id="generate" type="submit">Generate Video</button>
      </form>

      <div id="status" class="status">
        <strong id="statusText">Preparing...</strong>
        <div id="detail" class="small" style="margin-top:6px"></div>
        <div id="error" class="error" style="margin-top:10px"></div>
      </div>

      <div id="result"></div>
    </div>
  </div>

<script>
const form = document.getElementById("form");
const image = document.getElementById("image");
const preview = document.getElementById("preview");
const button = document.getElementById("generate");
const statusBox = document.getElementById("status");
const statusText = document.getElementById("statusText");
const detail = document.getElementById("detail");
const errorBox = document.getElementById("error");
const result = document.getElementById("result");
const modelInput = document.getElementById("model");

fetch("/api/config").then(r => r.json()).then(c => {
  if (c.defaultModel) modelInput.value = c.defaultModel;
}).catch(() => {});

image.addEventListener("change", () => {
  const file = image.files?.[0];
  if (!file) { preview.style.display = "none"; return; }
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

function showStatus(text, extra="") {
  statusBox.classList.add("show");
  statusText.textContent = text;
  detail.textContent = extra;
  errorBox.textContent = "";
}

async function pollJob(id) {
  while (true) {
    const r = await fetch(`/api/status/${encodeURIComponent(id)}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || JSON.stringify(data));

    const progress = typeof data.progress === "number" ? ` · ${Math.round(data.progress * 100)}%` : "";
    showStatus(`Status: ${data.status || "unknown"}${progress}`, `Job ID: ${id}`);

    if (data.status === "succeeded") return data;
    if (["failed","canceled","expired"].includes(data.status)) {
      throw new Error(data.error?.message || `Generation ${data.status}.`);
    }
    await new Promise(resolve => setTimeout(resolve, 4000));
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  button.disabled = true;
  result.innerHTML = "";
  showStatus("Submitting generation...");

  try {
    const fd = new FormData(form);

    const r = await fetch("/api/generate", { method: "POST", body: fd });
    const data = await r.json();

    if (!r.ok) throw new Error(data.error || JSON.stringify(data));
    if (!data.id) throw new Error("Surplus did not return a job ID.");

    showStatus(`Status: ${data.status || "queued"}`, `Job ID: ${data.id}`);
    const finished = await pollJob(data.id);
    const artifact = finished.results?.[0];

    if (!artifact?.url && !artifact?.download_url) {
      throw new Error("Generation succeeded but no video artifact was returned.");
    }

    const src = artifact.url || artifact.download_url;
    result.innerHTML = `
      <video controls autoplay playsinline src="${src}"></video>
      <div class="actions">
        <a href="${src}" target="_blank" rel="noopener">Open / Download Video</a>
      </div>
    `;
    showStatus("Completed", `Job ID: ${data.id}`);
  } catch (err) {
    statusBox.classList.add("show");
    statusText.textContent = "Generation failed";
    errorBox.textContent = err.message || String(err);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
